<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Console — ScholarGrid</title>
  <link rel="icon" type="image/jpeg" href="assets/logo.jpg" />
  <link rel="apple-touch-icon" href="assets/logo.jpg" />
  <meta name="theme-color" content="#2563eb" />
  <link rel="stylesheet" href="styles/main.css" />
  <style>
    /* Admin specific light theme styles */
    .admin-hero {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 28px 32px;
      margin-bottom: 24px;
      box-shadow: var(--shadow-sm);
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 20px;
    }
    .admin-badge-secure {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(5, 150, 105, 0.1);
      color: #047857;
      border: 1px solid rgba(5, 150, 105, 0.25);
      border-radius: 999px;
      padding: 4px 12px;
      font-size: 0.8rem;
      font-weight: 700;
    }
    .admin-stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }
    .admin-stat-card {
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      box-shadow: var(--shadow-sm);
    }
    .admin-stat-val {
      font-size: 1.85rem;
      font-weight: 800;
      color: var(--text);
      line-height: 1.1;
      margin-top: 6px;
    }
    .admin-tabs {
      display: flex;
      gap: 8px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 24px;
      padding-bottom: 12px;
      overflow-x: auto;
    }
    .admin-tab-btn {
      background: none;
      border: 1px solid transparent;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.88rem;
      color: var(--text-muted);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .admin-tab-btn:hover {
      color: var(--text);
      background: #f1f5f9;
    }
    .admin-tab-btn.active {
      color: #ffffff;
      background: var(--primary);
      border-color: var(--primary);
    }
    .admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.88rem;
    }
    .admin-table th {
      padding: 12px 14px;
      background: #f8fafc;
      color: var(--text-muted);
      font-weight: 600;
      border-bottom: 1px solid var(--border);
    }
    .admin-table td {
      padding: 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    .admin-table tr:hover td {
      background: #f8fafc;
    }
    .gate-card {
      max-width: 520px;
      margin: 80px auto;
      background: #ffffff;
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px 36px;
      text-align: center;
      box-shadow: var(--shadow);
    }
    .gate-icon {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      background: rgba(220, 38, 38, 0.08);
      border: 1px solid rgba(220, 38, 38, 0.2);
      border-radius: 20px;
      display: grid;
      place-items: center;
      font-size: 1.8rem;
      color: var(--danger);
    }
    .whitelist-pill {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 6px 10px;
      font-family: monospace;
      font-size: 0.82rem;
      color: var(--text);
      display: inline-block;
      margin: 3px 0;
    }
  </style>
</head>
<body data-page="admin">
  <div class="app-shell" style="grid-template-columns:1fr;">
    <div class="main-content" style="max-width:1200px;margin:0 auto;width:100%;padding:24px;">
      
      <!-- Topbar Navigation -->
      <header class="topbar" style="position:static;margin-bottom:24px;border-radius:var(--radius);padding:0 24px;">
        <div class="topbar-left">
          <a href="index.html" class="sidebar-brand" style="padding:0;text-decoration:none;">
            <div class="sidebar-brand-avatar">SG</div>
            <div class="sidebar-brand-text">
              <span class="sidebar-brand-name">ScholarGrid</span>
              <span class="sidebar-brand-sub">Admin Console</span>
            </div>
          </a>
        </div>
        <div class="topbar-actions">
          <a href="index.html" class="btn btn-outline btn-sm">← Back to Student Workspace</a>
          <div id="adminTopAuthSlot"></div>
        </div>
      </header>

      <!-- Main Admin Content or Access Gate -->
      <main id="adminMainContent">
        <!-- Loading state -->
        <div style="padding:80px;text-align:center;color:var(--text-muted);">
          <div style="font-size:1.8rem;margin-bottom:12px;">⏳</div>
          <div style="font-weight:600;">Verifying administrative credentials...</div>
        </div>
      </main>

      <footer class="footer" style="margin-top:40px;text-align:center;color:var(--text-soft);font-size:0.8rem;">
        ScholarGrid Administration Console • Protected by Google OAuth &amp; Cloud Firestore CEL Rules
      </footer>
    </div>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <!-- Firebase Web SDK v10 (Compat) -->
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="scripts/firebase-config.js"></script>
  <script src="scripts/data.js"></script>
  <script src="scripts/resources.generated.js"></script>

  <script>
    (function () {
      const container = document.getElementById('adminMainContent');
      const topAuthSlot = document.getElementById('adminTopAuthSlot');

      function esc(str) {
        return String(str || '')
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function formatTime(isoStr) {
        if (!isoStr) return 'Just now';
        try {
          const d = new Date(isoStr);
          return d.toLocaleDateString('en-IN', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        } catch {
          return isoStr;
        }
      }

      // Check Authentication State
      function checkAccess() {
        if (!window.ScholarFirebase || !window.ScholarFirebase.auth) {
          setTimeout(checkAccess, 150);
          return;
        }

        window.ScholarFirebase.auth.onAuthStateChanged((user) => {
          const isAdmin = window.ScholarFirebase.auth.isAdmin(user);
          renderTopNavAuth(user, isAdmin);

          if (isAdmin) {
            renderAdminDashboard(user);
          } else {
            renderAccessDeniedGate(user);
          }
        });
      }

      // Render Top Nav Auth Slot
      function renderTopNavAuth(user, isAdmin) {
        if (!topAuthSlot) return;
        if (!user) {
          topAuthSlot.innerHTML = `
            <button id="gateLoginBtnTop" type="button" class="btn btn-primary btn-sm">
              Sign In with Google
            </button>
          `;
          const btn = document.getElementById('gateLoginBtnTop');
          if (btn) btn.addEventListener('click', handleGoogleSignIn);
        } else {
          topAuthSlot.innerHTML = `
            <div style="display:flex;align-items:center;gap:10px;">
              <span class="admin-badge-secure">${isAdmin ? '🛡️ Super Admin' : '👤 Student'}</span>
              <span style="font-size:0.85rem;font-weight:600;">${esc(user.email)}</span>
              <button id="topSignOutBtn" type="button" class="btn btn-outline btn-sm">Sign Out</button>
            </div>
          `;
          const sBtn = document.getElementById('topSignOutBtn');
          if (sBtn) {
            sBtn.addEventListener('click', async () => {
              await window.ScholarFirebase.auth.signOut();
              window.location.reload();
            });
          }
        }
      }

      // Handler for Google Sign-In
      async function handleGoogleSignIn() {
        try {
          await window.ScholarFirebase.auth.signInWithGoogle();
        } catch (err) {
          alert('Sign-In notice: ' + (err.message || 'Could not complete Google Sign-In'));
        }
      }

      // 1. ACCESS DENIED GATE
      function renderAccessDeniedGate(currentUser) {
        const adminEmails = window.ScholarFirebase.auth.getAdminEmails();

        container.innerHTML = `
          <div class="gate-card">
            <div class="gate-icon">🔒</div>
            <h2 style="font-size:1.5rem;font-weight:800;margin-bottom:8px;color:var(--text);">Administrative Access Restricted</h2>
            <p style="font-size:0.92rem;color:var(--text-muted);line-height:1.5;margin-bottom:20px;">
              This terminal is strictly reserved for verified ScholarGrid campus administrators. Access is denied for unauthorized accounts.
            </p>

            ${currentUser ? `
              <div style="background:#fef2f2;border:1px solid #fecaca;border-radius:12px;padding:12px;font-size:0.85rem;color:#b91c1c;margin-bottom:20px;text-align:left;">
                <strong>Logged In As:</strong> <code>${esc(currentUser.email)}</code><br />
                This email is not in the authorized administrator whitelist.
              </div>
            ` : ''}

            <div style="background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:16px;text-align:left;font-size:0.85rem;margin-bottom:24px;">
              <strong style="color:var(--text);display:block;margin-bottom:6px;">Whitelisted Administrator Accounts:</strong>
              ${adminEmails.map(e => `<div><span class="whitelist-pill">🔑 ${esc(e)}</span></div>`).join('')}
            </div>

            <div style="display:flex;flex-direction:column;gap:10px;">
              <button id="gateGoogleLoginBtn" type="button" class="btn btn-primary" style="padding:12px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:10px;">
                <svg width="18" height="18" viewBox="0 0 24 24">
                  <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/>
                  <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.1-6.72-4.93H1.25v3.15C3.26 21.36 7.33 24 12 24z"/>
                  <path fill="#FBBC05" d="M5.28 14.27c-.25-.72-.38-1.49-.38-2.27s.13-1.55.38-2.27V6.58H1.25C.45 8.18 0 9.99 0 12s.45 3.82 1.25 5.42l4.03-3.15z"/>
                  <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.64 1.25 6.58l4.03 3.15c.95-2.83 3.6-4.98 6.72-4.98z"/>
                </svg>
                <span>Sign in with Whitelisted Gmail</span>
              </button>

              <button id="gateDemoAdminBtn" type="button" class="btn btn-outline" style="padding:10px;">
                ⚡ Switch to Admin Demo Account (mohitjgujjar7@gmail.com)
              </button>

              <a href="index.html" class="btn btn-outline" style="text-decoration:none;margin-top:6px;">
                ← Return to Student Homepage
              </a>
            </div>
          </div>
        `;

        document.getElementById('gateGoogleLoginBtn')?.addEventListener('click', handleGoogleSignIn);
        document.getElementById('gateDemoAdminBtn')?.addEventListener('click', () => {
          window.ScholarFirebase.auth.signInWithDemo();
          window.location.reload();
        });
      }

      // 2. ADMIN DASHBOARD
      async function renderAdminDashboard(user) {
        const adminService = window.ScholarFirebase.admin;
        const [announcements, feedback] = await Promise.all([
          adminService.getAnnouncements(),
          adminService.getFeedback()
        ]);

        const pendingFeedbackCount = feedback.filter(f => f.status !== 'resolved').length;

        container.innerHTML = `
          <!-- Admin Hero Header -->
          <div class="admin-hero">
            <div>
              <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;">
                <span class="admin-badge-secure">🛡️ Verified Super Admin</span>
                <span class="badge badge-subtle">Cloud Firestore Live</span>
              </div>
              <h1 style="font-size:1.6rem;font-weight:800;color:var(--text);margin:0 0 4px;">ScholarGrid Admin Terminal</h1>
              <p style="margin:0;font-size:0.88rem;color:var(--text-muted);">
                Welcome back, <strong>${esc(user.displayName || user.email)}</strong> • Whitelist session active.
              </p>
            </div>
            <div style="display:flex;gap:10px;">
              <button id="refreshAdminBtn" type="button" class="btn btn-outline btn-sm">↻ Refresh Data</button>
              <a href="index.html" class="btn btn-primary btn-sm">Preview Live Site ↗</a>
            </div>
          </div>

          <!-- Quick KPI Cards -->
          <div class="admin-stats-grid">
            <div class="admin-stat-card">
              <span style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;">📢 Campus Announcements</span>
              <div class="admin-stat-val" id="kpiAnnCount">${announcements.length}</div>
              <span style="font-size:0.75rem;color:var(--success);">Active on student dashboards</span>
            </div>

            <div class="admin-stat-card">
              <span style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;">📬 Pending Student Queries</span>
              <div class="admin-stat-val" style="color:${pendingFeedbackCount > 0 ? 'var(--warning)' : 'var(--success)'};">${pendingFeedbackCount}</div>
              <span style="font-size:0.75rem;color:var(--text-soft);">${feedback.length} total messages received</span>
            </div>

            <div class="admin-stat-card">
              <span style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;">📚 Academic Modules</span>
              <div class="admin-stat-val">20</div>
              <span style="font-size:0.75rem;color:var(--text-soft);">BCA Sem I–VI Curricula</span>
            </div>

            <div class="admin-stat-card">
              <span style="font-size:0.8rem;font-weight:700;color:var(--text-muted);text-transform:uppercase;">🔒 Whitelisted Super Admins</span>
              <div class="admin-stat-val" style="color:var(--primary);">2</div>
              <span style="font-size:0.75rem;color:var(--text-soft);">mohitjgujjar7 &amp; lalithulalu</span>
            </div>
          </div>

          <!-- Admin Tab Navigation -->
          <div class="admin-tabs" role="tablist">
            <button type="button" class="admin-tab-btn active" data-tab="announcements">
              <span>📢</span> Broadcast Announcements (<span id="tabCountAnn">${announcements.length}</span>)
            </button>
            <button type="button" class="admin-tab-btn" data-tab="feedback">
              <span>📬</span> Student Feedback &amp; Queries (<span id="tabCountFb">${feedback.length}</span>)
            </button>
            <button type="button" class="admin-tab-btn" data-tab="modules">
              <span>📚</span> Academic Module Directory
            </button>
            <button type="button" class="admin-tab-btn" data-tab="security">
              <span>🛡️</span> Security &amp; Whitelist Audit
            </button>
          </div>

          <!-- Tab Content Containers -->
          <div id="tabContentWrap">
            <!-- Announcements Tab (Default) -->
            <div id="tabAnnouncements" class="admin-tab-panel">
              <div style="display:grid;grid-template-columns:1fr 1.6fr;gap:24px;align-items:start;">
                
                <!-- New Announcement Form -->
                <div class="card" style="padding:24px;">
                  <h3 style="margin:0 0 16px;font-size:1.15rem;font-weight:700;">📢 Broadcast New Announcement</h3>
                  <form id="newAnnForm">
                    <div class="form-group" style="margin-bottom:14px;">
                      <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;">Announcement Title *</label>
                      <input type="text" id="annTitleInput" class="input" placeholder="e.g. Tumkur University Exam Timetable Released" required />
                    </div>

                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px;">
                      <div class="form-group">
                        <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;">Category Tag</label>
                        <select id="annTagSelect" class="input">
                          <option value="Examination">Examination</option>
                          <option value="Placement">Placement</option>
                          <option value="Academic">Academic</option>
                          <option value="Internship">Internship</option>
                          <option value="Urgent Alert">Urgent Alert</option>
                        </select>
                      </div>

                      <div class="form-group">
                        <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;">Urgent Banner</label>
                        <label style="display:flex;align-items:center;gap:8px;margin-top:8px;cursor:pointer;font-size:0.85rem;">
                          <input type="checkbox" id="annUrgentCheck" />
                          <span>Highlight as Flash Alert</span>
                        </label>
                      </div>
                    </div>

                    <div class="form-group" style="margin-bottom:16px;">
                      <label style="display:block;font-size:0.85rem;font-weight:600;margin-bottom:6px;">Announcement Details *</label>
                      <textarea id="annBodyInput" class="input" rows="4" placeholder="Enter detailed notice, links, or instructions for students..." required></textarea>
                    </div>

                    <button type="submit" id="annSubmitBtn" class="btn btn-primary" style="width:100%;font-weight:700;">
                      🚀 Publish Announcement to Live Site
                    </button>
                  </form>
                </div>

                <!-- Published Announcements List -->
                <div class="card" style="padding:24px;">
                  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;">
                    <h3 style="margin:0;font-size:1.15rem;font-weight:700;">Active Announcements</h3>
                    <span style="font-size:0.82rem;color:var(--text-muted);">${announcements.length} posted</span>
                  </div>

                  <div id="annListContainer" style="display:flex;flex-direction:column;gap:12px;">
                    ${renderAnnouncementsListHtml(announcements)}
                  </div>
                </div>

              </div>
            </div>

            <!-- Feedback Tab -->
            <div id="tabFeedback" class="admin-tab-panel" style="display:none;">
              <div class="card" style="padding:24px;">
                <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:12px;">
                  <div>
                    <h3 style="margin:0 0 4px;font-size:1.15rem;font-weight:700;">📬 Student Support Requests &amp; Feedback</h3>
                    <p style="margin:0;font-size:0.82rem;color:var(--text-muted);">Inquiries submitted through the Student Support modal</p>
                  </div>
                  <div class="segmented-control" id="feedbackFilterControl">
                    <button type="button" class="segment-btn active" data-fb-filter="all">All (${feedback.length})</button>
                    <button type="button" class="segment-btn" data-fb-filter="pending">Pending (${pendingFeedbackCount})</button>
                    <button type="button" class="segment-btn" data-fb-filter="resolved">Resolved (${feedback.length - pendingFeedbackCount})</button>
                  </div>
                </div>

                <div style="overflow-x:auto;">
                  <table class="admin-table">
                    <thead>
                      <tr>
                        <th>Date</th>
                        <th>Student</th>
                        <th>Category</th>
                        <th>Subject &amp; Message</th>
                        <th>Status</th>
                        <th>Actions</th>
                      </tr>
                    </thead>
                    <tbody id="feedbackTableBody">
                      ${renderFeedbackRowsHtml(feedback)}
                    </tbody>
                  </table>
                </div>
              </div>
            </div>

            <!-- Modules Tab -->
            <div id="tabModules" class="admin-tab-panel" style="display:none;">
              <div class="card" style="padding:24px;">
                <h3 style="margin:0 0 16px;font-size:1.15rem;font-weight:700;">📚 ScholarGrid Curated Modules (20)</h3>
                <div class="grid grid-3">
                  ${window.SCHOLAR_DATA.modules.map(m => `
                    <div class="card" style="box-shadow:none;border-color:var(--border);">
                      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;">
                        <span class="badge">${esc(m.badge)}</span>
                        <a href="resource.html#${m.id}" target="_blank" class="btn btn-outline btn-sm">Inspect ↗</a>
                      </div>
                      <div class="card-title" style="font-size:1rem;">${esc(m.title)}</div>
                      <div class="card-desc" style="font-size:0.82rem;">${esc(m.desc)}</div>
                    </div>
                  `).join('')}
                </div>
              </div>
            </div>

            <!-- Security Audit Tab -->
            <div id="tabSecurity" class="admin-tab-panel" style="display:none;">
              <div class="card" style="padding:28px;">
                <h3 style="margin:0 0 14px;font-size:1.25rem;font-weight:800;">🛡️ Security &amp; Access Control Architecture</h3>
                <p style="font-size:0.9rem;color:var(--text-muted);line-height:1.6;margin-bottom:20px;">
                  ScholarGrid enforces role-based access control (RBAC) via Google OAuth token verification and Cloud Firestore CEL rules.
                </p>

                <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px;">
                  <div style="background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:18px;">
                    <h4 style="margin:0 0 10px;font-size:0.95rem;font-weight:700;color:var(--primary);">Whitelisted Administrators</h4>
                    <ul style="padding-left:18px;font-size:0.88rem;color:var(--text);line-height:1.8;">
                      <li><code>mohitjgujjar7@gmail.com</code> (Primary Owner)</li>
                      <li><code>lalithulalu@gmail.com</code> (Co-Administrator)</li>
                    </ul>
                  </div>

                  <div style="background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:18px;">
                    <h4 style="margin:0 0 10px;font-size:0.95rem;font-weight:700;color:var(--success);">Active Cloud Protections</h4>
                    <ul style="padding-left:18px;font-size:0.88rem;color:var(--text);line-height:1.8;">
                      <li><strong>Database:</strong> Cloud Firestore (scholargrid-65385)</li>
                      <li><strong>Auth Rule:</strong> <code>request.auth.token.email in [...]</code></li>
                      <li><strong>Public Write:</strong> Blocked (Default Deny)</li>
                    </ul>
                  </div>
                </div>

                <div style="background:#f8fafc;border:1px solid var(--border);border-radius:14px;padding:16px;">
                  <h4 style="margin:0 0 8px;font-size:0.9rem;font-weight:700;">Firestore Security Rules Definition:</h4>
                  <pre style="background:#ffffff;border:1px solid var(--border);border-radius:8px;padding:14px;font-family:monospace;font-size:0.82rem;overflow-x:auto;">function isAdmin() {
  return isAuthenticated() &amp;&amp; 
         request.auth.token.email in ['mohitjgujjar7@gmail.com', 'lalithulalu@gmail.com'];
}

match /announcements/{id} {
  allow read: if true;
  allow write: if isAdmin();
}

match /feedback/{id} {
  allow create: if isAuthenticated();
  allow read, update, delete: if isAdmin();
}</pre>
                </div>
              </div>
            </div>

          </div>
        `;

        // Wire up Tab switching
        document.querySelectorAll('.admin-tab-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('.admin-tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.admin-tab-panel').forEach(p => p.style.display = 'none');
            btn.classList.add('active');
            const target = btn.dataset.tab;
            if (target === 'announcements') document.getElementById('tabAnnouncements').style.display = 'block';
            else if (target === 'feedback') document.getElementById('tabFeedback').style.display = 'block';
            else if (target === 'modules') document.getElementById('tabModules').style.display = 'block';
            else if (target === 'security') document.getElementById('tabSecurity').style.display = 'block';
          });
        });

        // Wire up Announcement Publishing
        const annForm = document.getElementById('newAnnForm');
        if (annForm) {
          annForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const title = document.getElementById('annTitleInput').value.trim();
            const tag = document.getElementById('annTagSelect').value;
            const urgent = document.getElementById('annUrgentCheck').checked;
            const body = document.getElementById('annBodyInput').value.trim();
            const submitBtn = document.getElementById('annSubmitBtn');

            if (!title || !body) return;
            submitBtn.disabled = true;
            submitBtn.textContent = 'Publishing...';

            await adminService.createAnnouncement({ title, body, tag, urgent });
            submitBtn.disabled = false;
            submitBtn.textContent = '🚀 Publish Announcement to Live Site';
            annForm.reset();

            // Refresh list
            const updated = await adminService.getAnnouncements();
            document.getElementById('annListContainer').innerHTML = renderAnnouncementsListHtml(updated);
            document.getElementById('kpiAnnCount').textContent = updated.length;
            document.getElementById('tabCountAnn').textContent = updated.length;
            wireAnnouncementDeleteButtons();
          });
        }

        // Wire up Refresh button
        document.getElementById('refreshAdminBtn')?.addEventListener('click', () => {
          renderAdminDashboard(user);
        });

        // Wire up Announcement Deletes
        wireAnnouncementDeleteButtons();

        // Wire up Feedback actions & filters
        wireFeedbackInteractions(feedback);
      }

      function renderAnnouncementsListHtml(list) {
        if (!list || !list.length) {
          return '<div style="padding:24px;text-align:center;color:var(--text-muted);">No announcements published yet.</div>';
        }
        return list.map(item => `
          <div class="card" style="box-shadow:none;border-color:var(--border);padding:14px 16px;${item.urgent ? 'border-left:4px solid var(--danger);background:rgba(220,38,38,0.02);' : ''}">
            <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;">
              <div>
                <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;">
                  <span class="badge ${item.urgent ? 'badge-paid' : 'badge-subtle'}">${esc(item.tag)}</span>
                  ${item.urgent ? '<span style="font-size:0.75rem;font-weight:700;color:var(--danger);">⚡ Flash Alert</span>' : ''}
                  <span style="font-size:0.75rem;color:var(--text-muted);">${formatTime(item.createdAt)}</span>
                </div>
                <div style="font-weight:700;font-size:0.95rem;color:var(--text);margin-bottom:4px;">${esc(item.title)}</div>
                <div style="font-size:0.85rem;color:var(--text-muted);">${esc(item.body)}</div>
              </div>
              <button type="button" class="btn btn-outline btn-sm delete-ann-btn" data-id="${esc(item.id)}" style="color:var(--danger);border-color:#fecaca;" title="Delete announcement">
                ✕
              </button>
            </div>
          </div>
        `).join('');
      }

      function wireAnnouncementDeleteButtons() {
        document.querySelectorAll('.delete-ann-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            if (confirm('Delete this announcement? It will be removed from all student dashboards.')) {
              btn.disabled = true;
              await window.ScholarFirebase.admin.deleteAnnouncement(id);
              const updated = await window.ScholarFirebase.admin.getAnnouncements();
              document.getElementById('annListContainer').innerHTML = renderAnnouncementsListHtml(updated);
              document.getElementById('kpiAnnCount').textContent = updated.length;
              document.getElementById('tabCountAnn').textContent = updated.length;
              wireAnnouncementDeleteButtons();
            }
          });
        });
      }

      function renderFeedbackRowsHtml(list) {
        if (!list || !list.length) {
          return '<tr><td colspan="6" style="text-align:center;color:var(--text-muted);padding:32px;">No student feedback received yet.</td></tr>';
        }
        return list.map(item => `
          <tr data-fb-status="${esc(item.status || 'pending')}">
            <td style="white-space:nowrap;font-size:0.8rem;color:var(--text-muted);">${formatTime(item.createdAt)}</td>
            <td>
              <div style="font-weight:600;">${esc(item.name || 'Student')}</div>
              <div style="font-size:0.75rem;color:var(--text-muted);">${esc(item.email || '—')}</div>
            </td>
            <td><span class="badge badge-subtle">${esc(item.category || 'General')}</span></td>
            <td>
              <div style="font-weight:600;margin-bottom:2px;">${esc(item.subject || 'Support Ticket')}</div>
              <div style="font-size:0.82rem;color:var(--text-muted);max-width:380px;">${esc(item.message || '')}</div>
            </td>
            <td>
              <span class="badge ${item.status === 'resolved' ? 'badge-free' : 'badge-freemium'}">
                ${item.status === 'resolved' ? '✓ Resolved' : '⏳ Pending'}
              </span>
            </td>
            <td>
              <div style="display:flex;gap:6px;">
                <button type="button" class="btn btn-outline btn-sm toggle-fb-btn" data-id="${esc(item.id)}" data-next="${item.status === 'resolved' ? 'pending' : 'resolved'}">
                  ${item.status === 'resolved' ? 'Reopen' : 'Resolve'}
                </button>
                <button type="button" class="btn btn-outline btn-sm delete-fb-btn" data-id="${esc(item.id)}" style="color:var(--danger);">
                  ✕
                </button>
              </div>
            </td>
          </tr>
        `).join('');
      }

      function wireFeedbackInteractions(feedback) {
        // Status toggle
        document.querySelectorAll('.toggle-fb-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            const nextStatus = btn.dataset.next;
            await window.ScholarFirebase.admin.updateFeedbackStatus(id, nextStatus);
            const updated = await window.ScholarFirebase.admin.getFeedback();
            document.getElementById('feedbackTableBody').innerHTML = renderFeedbackRowsHtml(updated);
            wireFeedbackInteractions(updated);
          });
        });

        // Delete feedback
        document.querySelectorAll('.delete-fb-btn').forEach(btn => {
          btn.addEventListener('click', async () => {
            const id = btn.dataset.id;
            if (confirm('Delete this feedback entry?')) {
              await window.ScholarFirebase.admin.deleteFeedback(id);
              const updated = await window.ScholarFirebase.admin.getFeedback();
              document.getElementById('feedbackTableBody').innerHTML = renderFeedbackRowsHtml(updated);
              wireFeedbackInteractions(updated);
            }
          });
        });

        // Filter tabs
        document.querySelectorAll('#feedbackFilterControl .segment-btn').forEach(fBtn => {
          fBtn.addEventListener('click', () => {
            document.querySelectorAll('#feedbackFilterControl .segment-btn').forEach(b => b.classList.remove('active'));
            fBtn.classList.add('active');
            const filter = fBtn.dataset.fbFilter;
            document.querySelectorAll('#feedbackTableBody tr[data-fb-status]').forEach(row => {
              if (filter === 'all' || row.dataset.fbStatus === filter) {
                row.style.display = '';
              } else {
                row.style.display = 'none';
              }
            });
          });
        });
      }

      // Initialize
      document.addEventListener('DOMContentLoaded', checkAccess);
    })();
  </script>
</body>
</html>
